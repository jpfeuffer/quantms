name: spectronaut_pulsar_step3
description: Generate final search archives using Pulsar step 3 with .qsp file (parallelized per batch).
keywords:
  - spectronaut
  - pulsar
  - DIA
  - distributed
tools:
  - Spectronaut:
      description: |
        Spectronaut Pulsar step 3 for final search archive generation.
      homepage: https://biognosys.com/software/spectronaut/
input:
  - meta:
      type: map
      description: Metadata including experiment_id and batch_id.
  - raw_files:
      type: file
      description: Raw MS files for this batch.
  - step1_archive:
      type: file
      description: Intermediate archive from step 1 for this batch.
      pattern: "*.psar"
  - qsp_file:
      type: file
      description: Optimized models file from step 2.
      pattern: "*.qsp"
output:
  - meta:
      type: map
      description: Metadata passed through.
  - search_archive:
      type: file
      description: Final search archive (.psar).
      pattern: "*.psar"
  - versions:
      type: file
      description: Versions file.
      pattern: "versions.yml"
authors:
  - "@quantms"
