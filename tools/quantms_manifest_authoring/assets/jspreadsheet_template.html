<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      window.formula = window.formula || null;
      window.jSuites = window.jSuites || undefined;
      var formula = window.formula;
      var jSuites = window.jSuites;
    </script>
    <link rel="stylesheet" href="/quantms-manifest/vendor/jsuites/jsuites.css" />
    <link rel="stylesheet" href="/quantms-manifest/vendor/jspreadsheet-ce/jspreadsheet.css" />
    <script src="/quantms-manifest/vendor/jsuites/jsuites.js"></script>
    <script src="/quantms-manifest/vendor/jspreadsheet-ce/jspreadsheet.js"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        margin: 0;
        padding: 10px;
      }

      #spreadsheet {
        width: 100%;
        border-radius: 4px;
        overflow: hidden;
      }

      .jspreadsheet {
        border: 1px solid #ddd;
      }

      .jspreadsheet tr td {
        padding: 8px;
        min-width: 80px;
      }

      .jspreadsheet tr[data-selected="1"] td {
        background-color: #f0f0f0;
      }

      /* Required field indicator */
      .jspreadsheet th:first-child::after {
        content: " *";
        color: #d32f2f;
        font-weight: bold;
      }

      .controls {
        margin: 10px 0;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn {
        padding: 8px 16px;
        border: 1px solid #ccc;
        background: #f5f5f5;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }

      .btn:hover {
        background: #e0e0e0;
      }

      .btn-delete {
        background: #ffebee;
        border-color: #d32f2f;
        color: #d32f2f;
      }

      .btn-delete:hover {
        background: #ffcdd2;
      }

      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="spreadsheet"></div>
    <div id="status"></div>

    <script>
      /**
       * Initialize jspreadsheet with data from Python backend.
       *
       * Window variables must be set by NiceGUI before this script runs:
       * - window.spreadsheetHeaders: Column header names
       * - window.spreadsheetData: 2D array of data
       * - window.onCellEdit: Callback(rowIndex, colIndex, value)
       * - window.onRowDelete: Callback(rowIndex)
       */

      function initializeSpreadsheet() {
        // Check if data is ready
        if (!window.spreadsheetHeaders || !window.spreadsheetData) {
          console.error("Spreadsheet data not initialized by NiceGUI");
          document.getElementById("status").textContent = "Error: No data available";
          return;
        }

        const headers = window.spreadsheetHeaders;
        const data = window.spreadsheetData;

        // Column configuration
        const columns = headers.map((header, idx) => {
          let column = {
            title: header.replace(/_/g, " ").toUpperCase(),
            width: 150,
          };

          // Mark required fields (file is required)
          if (header === "file") {
            column.required = true;
          }

          return column;
        });

        const spreadsheet = jspreadsheet(document.getElementById("spreadsheet"), {
          tabs: false,
          toolbar: false,
          worksheets: [
            {
              worksheetName: "Runs",
              data: data,
              columns: columns,
              minDimensions: [headers.length, Math.max(data.length, 5)],
              tableOverflow: true,
              editable: true,
              allowInsertColumn: false,
              allowDeleteColumn: false,
              allowInsertRow: false,
              allowManualInsertRow: false,
              onchange: function (instance, cell, col, row, value) {
                const rowIndex = row;
                const colIndex = col;

                if (window.onCellEdit) {
                  try {
                    window.onCellEdit(rowIndex, colIndex, value);
                  } catch (error) {
                    console.error("Error in onCellEdit callback:", error);
                    // Revert the change
                    instance.undo();
                  }
                }
              },
              ondeleterow: function (instance, rows) {
                if (window.onRowDelete) {
                  try {
                    window.onRowDelete(rows);
                  } catch (error) {
                    console.error("Error in onRowDelete callback:", error);
                  }
                }
              },
            },
          ],
        });

        // Update status
        document.getElementById("status").textContent = `Loaded ${data.length} run(s)`;

        // Store reference for later access
        window.spreadsheetInstance = spreadsheet;
      }

      // Initialize when DOM is ready
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initializeSpreadsheet);
      } else {
        initializeSpreadsheet();
      }
    </script>
  </body>
</html>
