# Valid quantms YAML input example: TMT 16-plex DDA experiment
# Demonstrates the canonical structure for the current YAML specification

experiment:
  # Core MS method settings
  acquisition_method: DDA
  enzyme: Trypsin
  dissociation_method: HCD

  # Explicit quantification method declaration
  quantification_method: TMT

  # Fixed modifications (pre-set for all samples)
  fixed_mods:
    - "Carbamidomethyl (C)"
    - "TMT16plex (K)"
    - "TMT16plex (N-term)"

  # Experiment-level variable modifications
  variable_mods:
    - "Oxidation (M)"

  # Mass calibration tolerance settings
  precursor_mass_tolerance: "10 ppm"
  fragment_mass_tolerance: "0.02 Da"

# Biological samples: one entry per unique biological unit
samples:
  - id: treated_rep1
    organism: homo sapiens
    organism_part: cell line
    condition: treated
    biological_replicate: 1
    additional_metadata:
      cell_line: HeLa
      passage: 10

  - id: control_rep1
    organism: homo sapiens
    organism_part: cell line
    condition: control
    biological_replicate: 1
    additional_metadata:
      cell_line: HeLa
      passage: 10

  - id: treated_rep2
    organism: homo sapiens
    organism_part: cell line
    condition: treated
    biological_replicate: 2
    additional_metadata:
      cell_line: HeLa
      passage: 11

  - id: control_rep2
    organism: homo sapiens
    organism_part: cell line
    condition: control
    biological_replicate: 2
    additional_metadata:
      cell_line: HeLa
      passage: 11

# Mixture definitions: groups of samples multiplexed together via isobaric labels
# The channels dictionary maps label names to sample IDs
mixtures:
  - id: mix_batch1
    description: "First TMT16 batch with treated and control replicates"
    channels:
      TMT126: treated_rep1
      TMT127N: treated_rep2
      TMT127C: control_rep1
      TMT128N: control_rep2
      TMT128C: treated_rep1 # Example of reuse in same mixture
      # Other channels left empty (nulls omitted for clarity)

  - id: mix_batch2
    description: "Second TMT16 batch with technical replicates"
    channels:
      TMT126: treated_rep1
      TMT127N: control_rep1

  # Future: SILAC experiments can also use mixtures.channels:
  # - id: silac_light_heavy
  #   channels:
  #     light: unlabeled_sample
  #     heavy: silac_labeled_sample

# Runs: raw spectrometry files with their fraction and mixture assignment
# Fraction is implicit if all runs for a mixture have fraction=1
runs:
  - file: s3://bucket/experiment/mix_batch1_fraction_1.raw
    fraction: 1
    mixture: mix_batch1
    instrument: Q_TOF

  - file: s3://bucket/experiment/mix_batch1_fraction_2.raw
    fraction: 2
    mixture: mix_batch1
    instrument: Q_TOF

  - file: s3://bucket/experiment/mix_batch2_fraction_1.raw
    fraction: 1
    mixture: mix_batch2
    instrument: Q_TOF

# Named modification profiles: each entry is ONE modification. Supporting two explicit
# types: ontology-backed (with accession or name) and custom (user-defined, no ontology).
# Reference by id via 'custom_mod_profile' at experiment or run level; takes precedence
# over experiment-level fixed_mods/variable_mods.
mod_profiles:
  # Ontology-backed modification with accession and mode
  - id: phospho_ser
    kind: ontology
    name: "Phosphorylation"
    accession: "UNIMOD:21"
    residues: S
    mode: variable
    mass_shift: 79.966331
    formula: "HO3P"
    term_spec: none
    comet:
      binary_group: 1
      min_occurrences: 0
      max_occurrences: 3

  # Ontology-backed modification with name only (accession optional if name provided)
  - id: phospho_thr
    kind: ontology
    name: "Phosphorylation"
    accession: "UNIMOD:21"
    residues: T
    mode: variable
    mass_shift: 79.966331
    formula: "HO3P"
    term_spec: none

  # Ontology-backed modification with accession only
  - id: phospho_tyr
    kind: ontology
    accession: "UNIMOD:21"
    residues: Y
    mode: variable
    mass_shift: 79.966331
    formula: "HO3P"
    term_spec: none

