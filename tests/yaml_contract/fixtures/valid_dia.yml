# Valid quantms YAML input example: Data-Independent Acquisition (DIA) experiment
# Demonstrates the YAML structure for DIA label-free quantification

experiment:
  # Core MS method settings - DIA acquisition
  acquisition_method: DIA
  enzyme: Trypsin
  dissociation_method: HCD

  # Explicit quantification method declaration for DIA
  quantification_method: LFQ

  # Fixed modifications (pre-set for all samples)
  fixed_mods:
    - "Carbamidomethyl (C)"

  # Experiment-level variable modifications
  variable_mods:
    - "Oxidation (M)"

  # Mass calibration tolerance settings
  precursor_mass_tolerance: "10 ppm"
  fragment_mass_tolerance: "0.02 Da"

# Biological samples: one entry per unique biological unit
samples:
  - id: control_rep1
    organism: homo sapiens
    organism_part: cell culture
    condition: control
    biological_replicate: 1
    additional_metadata:
      cell_line: HeLa
      passage: 10

  - id: treated_rep1
    organism: homo sapiens
    organism_part: cell culture
    condition: treated
    biological_replicate: 1
    additional_metadata:
      cell_line: HeLa
      passage: 10

# No mixtures for DIA LFQ (empty array) - each sample measured independently
mixtures: []

# Runs: raw spectrometry files with their fraction assignment
# Each run belongs to exactly one sample (no multiplexing)
runs:
  - file: s3://bucket/experiment/control_rep1_fraction_1.raw
    fraction: 1
    mixture: null
    instrument: Orbitrap_Fusion

  - file: s3://bucket/experiment/control_rep1_fraction_2.raw
    fraction: 2
    mixture: null
    instrument: Orbitrap_Fusion

  - file: s3://bucket/experiment/treated_rep1_fraction_1.raw
    fraction: 1
    mixture: null
    instrument: Orbitrap_Fusion

  - file: s3://bucket/experiment/treated_rep1_fraction_2.raw
    fraction: 2
    mixture: null
    instrument: Orbitrap_Fusion
